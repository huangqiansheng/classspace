<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>⚔️ 擂台赛</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #0b1a2a; color: #fff; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .app { max-width: 1400px; width: 100%; background: rgba(255,255,255,0.04); border-radius: 24px; padding: 20px 24px 24px; border: 1px solid rgba(255,255,255,0.06); }

        .header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .header h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #f7971e, #ffd200); -webkit-background-clip: text; -webkit-text-fill-color: transparent; white-space: nowrap; }
        .header .info { display: flex; gap: 8px; font-size: 13px; color: #aaa; align-items: center; flex-wrap: wrap; margin-left: auto; }
        .header .info .badge { background: rgba(255,215,0,0.15); padding: 3px 12px; border-radius: 30px; border: 1px solid rgba(255,215,0,0.2); font-size: 13px; }
        .back-link { color: #6c5ce7; text-decoration: none; font-weight: 500; display: inline-flex; align-items: center; }
        .back-link:hover { text-decoration: underline; }
        .back-link img { width: 36px; height: 36px; }

        .mode-group { display: flex; gap: 4px; background: rgba(255,255,255,0.06); border-radius: 30px; padding: 3px; }
        .mode-group button { padding: 4px 14px; border: none; border-radius: 30px; background: transparent; color: #aaa; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .mode-group button.active { background: #ffd700; color: #000; }
        .mode-group button:hover:not(.active) { background: rgba(255,255,255,0.08); }

        .voice-selector { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #aaa; }
        .voice-selector select {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 13px;
            max-width: 130px;
            outline: none;
        }
        .voice-selector select option { background: #1a2a3a; color: #fff; }
        .voice-selector select:focus { border-color: #ffd700; }

        .btn { padding: 5px 18px; border: none; border-radius: 30px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #6c5ce7; color: #fff; }
        .btn-primary:hover { background: #5a4bd1; transform: scale(1.03); }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #1e8449; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-warning { background: #f39c12; color: #fff; }
        .btn-warning:hover { background: #d68910; }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #ccc; }
        .btn-outline:hover { background: rgba(255,255,255,0.08); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
        .class-status { font-size: 13px; color: #ffd700; font-weight: 600; white-space: nowrap; }

        .arena {
            display: flex;
            flex-direction: row;
            gap: 16px;
            height: calc(100vh - 220px);
            min-height: 520px;
            align-items: stretch;
        }

        .team-area {
            width: 240px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 12px 10px;
            border: 2px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .team-area.defender-area { border-color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.1); }
        .team-area.challenger-area { border-color: #00b4ff; box-shadow: 0 0 20px rgba(0,180,255,0.1); }

        .team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .team-name { font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
        .team-role { font-size: 11px; padding: 2px 8px; border-radius: 30px; background: rgba(255,255,255,0.08); flex-shrink: 0; }
        .team-score { font-size: 14px; color: #ffd700; font-weight: 700; }

        .member-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            padding: 2px 4px 2px 0;
            min-height: 0;
        }
        .member-list::-webkit-scrollbar { width: 3px; }
        .member-list::-webkit-scrollbar-track { background: transparent; }
        .member-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

        .member-btn {
            flex: 1 1 0;
            min-height: 0;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 4px 12px;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: left;
        }
        .member-btn:hover:not(:disabled) { background: rgba(255,255,255,0.16); transform: translateX(2px); border-color: #ffd700; }
        .member-btn .order-tag { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; border: 2px solid; flex-shrink: 0; }
        .member-btn .member-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .member-btn .score-tag { font-size: 12px; color: #8ab4f8; margin-left: auto; font-weight: 600; }
        .member-btn.selected { border-color: #ffd700 !important; background: rgba(255,215,0,0.2); box-shadow: 0 0 12px rgba(255,215,0,0.3); }
        .member-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; background: rgba(100,100,100,0.2); border-color: #555; }
        .member-btn.used { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }
        .member-btn.safe-negative { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; border-color: #e74c3c; }

        .order-tag.color-1 { color: #ffffff; border-color: #ffffff; background: rgba(255,255,255,0.15); }
        .order-tag.color-2 { color: #E53935; border-color: #E53935; background: rgba(229,57,53,0.2); }
        .order-tag.color-3 { color: #FF9100; border-color: #FF9100; background: rgba(255,145,0,0.2); }
        .order-tag.color-4 { color: #FFEA00; border-color: #FFEA00; background: rgba(255,234,0,0.2); }
        .order-tag.color-5 { color: #00E676; border-color: #00E676; background: rgba(0,230,118,0.2); }
        .order-tag.color-6 { color: #2979FF; border-color: #2979FF; background: rgba(41,121,255,0.2); }
        .order-tag.color-7 { color: #00BCD4; border-color: #00BCD4; background: rgba(0,188,212,0.2); }
        .order-tag.color-8 { color: #8E24AA; border-color: #8E24AA; background: rgba(142,36,170,0.2); }
        .order-tag.color-9 { color: #000000; border-color: #000000; background: rgba(0,0,0,0.15); }

        .stage {
            flex: 1;
            min-width: 0;
            position: relative;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 300px;
        }
        .stage-content { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; pointer-events: none; flex-direction: column; padding-bottom: 70px; }
        .stage-content .avatar-row { display: flex; align-items: center; justify-content: center; gap: 30px; }
        .stage-content .avatar { font-size: 60px; line-height: 1; transition: all 0.5s ease; }
        .stage-content .avatar.big { font-size: 100px; }
        .stage-content .avatar.fly-in { animation: flyIn 0.6s ease-out forwards; }
        .stage-content .avatar.fly-out { animation: flyOut 0.6s ease-in forwards; }
        @keyframes flyIn { 0% { transform: translateX(-200px) scale(0.5); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes flyOut { 0% { transform: translateX(0) scale(1); opacity: 1; } 100% { transform: translateX(200px) scale(0.5); opacity: 0; } }
        .stage-content .avatar.bounce { animation: bounce 0.8s ease; }
        @keyframes bounce { 0% { transform: scale(1); } 30% { transform: scale(1.3); } 60% { transform: scale(0.9); } 100% { transform: scale(1); } }
        .stage-content .avatar-label { color: #ffd700; font-size: 18px; font-weight: 700; margin-top: 10px; text-shadow: 0 2px 12px rgba(0,0,0,0.8); }
        .stage-content .avatar-label.blue { color: #00b4ff; }

        .timer-center { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); padding: 10px 22px; border-radius: 16px; border: 1px solid rgba(255,215,0,0.2); display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 10; }
        .countdown-display { font-size: 36px; font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.2); line-height: 1.1; }
        .timer-controls { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
        .timer-controls .btn { font-size: 11px; padding: 2px 10px; }
        .timer-setting { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #aaa; }
        .timer-setting input { width: 44px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 2px 4px; color: #fff; font-size: 13px; text-align: center; }
        .timer-setting input:focus { border-color: #ffd700; outline: none; }
        #statusText { font-size: 12px; color: #888; }

        .rank-float { position: absolute; top: 10px; z-index: 8; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); border-radius: 10px; padding: 6px 10px; max-height: 42%; overflow-y: auto; min-width: 100px; border: 1px solid rgba(255,215,0,0.12); }
        .rank-float::-webkit-scrollbar { width: 2px; }
        .rank-float::-webkit-scrollbar-track { background: transparent; }
        .rank-float::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
        .rank-float-left { left: 10px; }
        .rank-float-right { right: 10px; }
        .rank-float .title { font-size: 12px; font-weight: 700; color: #ffd700; margin-bottom: 3px; border-bottom: 1px solid rgba(255,215,0,0.12); padding-bottom: 2px; }
        .rank-float .item { display: flex; justify-content: space-between; font-size: 11px; padding: 1px 0; color: #ccc; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .rank-float .item .pos { color: #888; min-width: 18px; }
        .rank-float .item .name { flex: 1; margin-left: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-float .item .score { color: #ffd700; font-weight: 600; margin-left: 3px; }
        .rank-float .empty { color: #666; font-size: 11px; text-align: center; padding: 3px 0; }

        .history-section { margin-top: 16px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 14px; }
        .history-section h3 { font-size: 17px; margin-bottom: 8px; color: #ffd700; }
        .history-table-wrap { max-height: 220px; overflow-y: auto; border-radius: 12px; background: rgba(255,255,255,0.02); }
        .history-table-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .history-table-wrap th { background: rgba(255,255,255,0.05); padding: 5px 10px; text-align: left; font-weight: 600; color: #aaa; position: sticky; top: 0; z-index: 2; }
        .history-table-wrap td { padding: 4px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .history-table-wrap tr:hover td { background: rgba(255,255,255,0.04); }

        .honor-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 9999; display: none; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity 0.4s; }
        .honor-overlay.show { display: flex; opacity: 1; pointer-events: auto; }
        .honor-box { background: rgba(10,20,35,0.95); border-radius: 32px; padding: 40px 60px; border: 3px solid #ffd700; text-align: center; max-width: 90%; box-shadow: 0 0 60px rgba(255,215,0,0.2); transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        .honor-overlay.show .honor-box { transform: scale(1); }
        .honor-box .emoji { font-size: 60px; display: block; margin-bottom: 4px; }
        .honor-box .msg { font-size: 28px; font-weight: 700; color: #ffd700; }
        .honor-box .sub { font-size: 16px; color: #ccc; margin-top: 4px; }
        .honor-box .slogan { font-size: 18px; color: #8ab4f8; margin-top: 6px; font-style: italic; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 9998; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #1a2a3a; border-radius: 24px; padding: 28px 32px; max-width: 520px; width: 95%; border: 1px solid rgba(255,215,0,0.2); box-shadow: 0 20px 60px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; }
        .modal-box h2 { color: #ffd700; font-size: 22px; margin-bottom: 10px; text-align: center; }
        .modal-box .sub { color: #ccc; font-size: 15px; margin-bottom: 16px; text-align: center; }
        .score-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); transition: background 0.2s; }
        .score-row.active-scoring { background: rgba(255,215,0,0.15); border-left: 4px solid #ffd700; }
        .score-row .info { flex: 1; }
        .score-row .info .name { font-size: 16px; font-weight: 600; color: #fff; }
        .score-row .info .group-tag { font-size: 12px; color: #888; margin-left: 6px; }
        .score-row .info .full { font-size: 13px; color: #aaa; }
        .score-row .current-score { font-size: 20px; font-weight: 700; color: #ffd700; min-width: 40px; text-align: center; }
        .score-row .adjust-btn { background: #3498db; color: #fff; border: none; border-radius: 30px; padding: 2px 14px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .score-row .adjust-btn:hover { background: #2980b9; transform: scale(1.05); }
        .score-row .adjust-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .modal-actions { display: flex; gap: 12px; margin-top: 18px; justify-content: flex-end; }

        .key-highlight {
            outline: 2px solid #ffd700 !important;
            outline-offset: 2px;
            box-shadow: 0 0 16px rgba(255,215,0,0.5);
            transition: outline 0.1s, box-shadow 0.1s;
        }

        @media (pointer: coarse) {
            .btn, .member-btn, .toolbar-btn, .mode-group button, .nav-btn, .panel-close, .adjust-btn { min-height: 40px; min-width: 40px; padding: 6px 14px; }
            .member-btn { min-height: 0; }
            .btn { padding: 8px 22px; }
            .timer-controls .btn { min-height: 34px; min-width: 34px; padding: 4px 12px; }
        }

        @media (max-width: 900px) {
            .arena { flex-direction: column; height: auto; min-height: 0; }
            .team-area { width: 100%; max-height: 220px; }
            .team-area.defender-area { order: 1; }
            .stage { order: 2; min-height: 260px; }
            .team-area.challenger-area { order: 3; }
            .member-list { max-height: 140px; }
            .member-btn { flex: 0 0 auto; min-height: 40px; }
            .timer-center { padding: 6px 14px; }
            .countdown-display { font-size: 28px; }
            .rank-float { min-width: 90px; padding: 4px 8px; }
            .rank-float .item { font-size: 10px; }
            .stage-content { padding-bottom: 60px; }
            .stage-content .avatar { font-size: 50px; }
            .stage-content .avatar.big { font-size: 80px; }
            .header h1 { font-size: 20px; }
        }
        @media (max-width: 480px) {
            .app { padding: 12px; }
            .header h1 { font-size: 18px; }
            .member-btn { font-size: 11px; padding: 6px 8px; }
            .member-btn .order-tag { width: 18px; height: 18px; font-size: 10px; }
            .stage-content .avatar { font-size: 40px; }
            .stage-content .avatar.big { font-size: 60px; }
            .rank-float { min-width: 70px; padding: 3px 6px; }
            .rank-float .item { font-size: 9px; }
            .stage-content { padding-bottom: 50px; }
        }
/* ===== 顶部工具栏紧凑布局（适配教学一体机，强制一行） ===== */
.header {
    flex-wrap: nowrap;
    gap: 6px 10px;
    min-width: 0;
}
.header h1 {
    font-size: 18px;
    flex-shrink: 0;
}
.header .info {
    flex-wrap: nowrap;
    gap: 6px;
    min-width: 0;
}
.header .info .badge {
    padding: 2px 10px;
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
}
.back-link { flex-shrink: 0; }
.back-link img { width: 32px; height: 32px; }
.mode-group { padding: 2px; flex-shrink: 0; }
.mode-group button { padding: 3px 10px; font-size: 12px; white-space: nowrap; }
.voice-selector { font-size: 12px; flex-shrink: 0; }
.voice-selector select { font-size: 12px; max-width: 110px; padding: 2px 4px; }
.class-status { font-size: 12px; flex-shrink: 0; }
.header .btn { padding: 4px 14px; font-size: 13px; white-space: nowrap; flex-shrink: 0; }

/* 中等宽度（如 1024×768、1280×800、1366×768）进一步压缩 */
@media (max-width: 1280px) {
    .header { gap: 4px 8px; }
    .header h1 { font-size: 16px; }
    .header .info .badge { padding: 2px 8px; font-size: 11px; }
    .mode-group button { padding: 2px 8px; font-size: 11px; }
    .voice-selector { font-size: 11px; }
    .voice-selector select { font-size: 11px; max-width: 90px; padding: 1px 3px; }
    .class-status { font-size: 11px; }
    .header .btn { padding: 3px 10px; font-size: 12px; }
    .back-link img { width: 28px; height: 28px; }
}

/* 更窄屏幕（4:3 一体机或 1024 宽）继续压缩 */
@media (max-width: 1024px) {
    .header { gap: 3px 6px; }
    .header h1 { font-size: 14px; }
    .header .info .badge { padding: 1px 6px; font-size: 10px; }
    .mode-group button { padding: 2px 6px; font-size: 10px; }
    .voice-selector { font-size: 10px; }
    .voice-selector select { font-size: 10px; max-width: 80px; padding: 1px 2px; }
    .class-status { font-size: 10px; }
    .header .btn { padding: 2px 8px; font-size: 11px; }
    .back-link img { width: 24px; height: 24px; }
}
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>🏆 擂台赛</h1>

        <div class="mode-group">
            <button class="active" data-mode="quiz">⚡ 抢答</button>
            <button data-mode="board">📝 板演</button>
        </div>

        <div class="voice-selector">
            🗣️ 音色
            <select id="voiceSelect"><option value="">默认</option></select>
        </div>

        <span class="class-status" id="classStatus">⏸️ 未开始</span>

        <button class="btn btn-outline" id="resetBtn">🔄 重置课堂</button>

        <div class="info">
            <span class="badge" id="classBadge">🏫 班级：加载中</span>
            <span class="badge" id="roundBadge">🔄 第 1 轮</span>
            <button class="btn btn-danger" id="classBtn" style="padding:3px 12px;font-size:13px;">🔕 下课</button>
            <a href="home.html" class="back-link">
                <img src="logo.svg" alt="logo">
            </a>
        </div>
    </div>

    <div class="arena">
        <div class="team-area defender-area" id="defenderArea">
            <div class="team-header">
                <span class="team-name" id="defenderName">守擂组</span>
                <span class="team-role">🛡️ 守擂</span>
                <span class="team-score" id="defenderScore">0</span>
            </div>
            <div class="member-list" id="defenderList"></div>
        </div>

        <div class="stage" id="stage">
            <div class="rank-float rank-float-left" id="rankLeft">
                <div class="title">🏅 小组排名</div>
                <div id="groupRankList"></div>
            </div>
            <div class="rank-float rank-float-right" id="rankRight">
                <div class="title">👤 个人排名</div>
                <div id="personRankList"></div>
            </div>
            <div class="stage-content" id="stageContent"></div>
            <div class="timer-center" id="timerCenter">
                <div class="countdown-display" id="countdownDisplay">0:00</div>
                <div class="timer-controls">
                    <button class="btn btn-success" id="startBtn" disabled>▶ 开始</button>
                    <button class="btn btn-warning" id="pauseBtn" disabled>⏸</button>
                    <button class="btn btn-danger" id="stopBtn" disabled>⏹</button>
                </div>
                <div class="timer-setting">
                    <span>⏱️</span>
                    <input type="number" id="minutesInput" value="1" min="0.5" step="0.5" />
                    <span>分钟</span>
                </div>
                <span id="statusText">⏳ 就绪</span>
            </div>
        </div>
