<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <title>📅 周课程表</title>
    <link rel="stylesheet" href="schedule.css">
</head>
<body>

    <div class="app">
        <div class="header">
            <h1>📅 周课程表</h1>

            <div class="btn-group">
                <div class="dropdown-wrap" id="exportDropdown">
                    <button class="btn btn-export" onclick="toggleExportMenu(event)">📤 导出 ▼</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="closeAllDropdowns(); exportData()">📄 导出 CSV<span class="sub-hint">可用 Excel 打开、打印查看</span></button>
                        <button class="dropdown-item" onclick="exportJSON()">💾 导出 JSON 完整备份<span class="sub-hint">换电脑、改代码前先导出一份存 U 盘</span></button>
                    </div>
                </div>
                <div class="dropdown-wrap" id="importDropdown">
                    <button class="btn btn-import" onclick="toggleImportMenu(event)">📥 导入 ▼</button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" onclick="closeAllDropdowns(); document.getElementById('fileInputCSV').click()">📄 导入 CSV<span class="sub-hint">只恢复课程名和备注，评论会丢</span></button>
                        <button class="dropdown-item" onclick="closeAllDropdowns(); document.getElementById('fileInputJSON').click()">💾 导入 JSON 备份<span class="sub-hint">完整恢复所有数据（推荐）</span></button>
                    </div>
                </div>
                <input type="file" id="fileInputCSV" accept=".csv" style="display:none;" onchange="handleImport(event)">
                <input type="file" id="fileInputJSON" accept=".json,application/json" style="display:none;" onchange="handleImportJSON(event)">
            </div>

            <div class="work-focus">
                <span class="work-focus-label">📌 本周工作重点：</span>
                <span class="work-focus-text empty" id="workFocusText" onclick="editWorkFocus()">点击此处设置本周工作重点</span>
            </div>

            <a href="home.html" class="back-link"><img src="logo.svg" alt="logo"></a>
        </div>

        <div class="table-wrap">
            <table id="scheduleTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- ============ 评分面板 ============ -->
    <div class="rating-panel" id="ratingPanel">
        <div class="panel-header">
            <div class="panel-title">
                <span id="ratingPanelCourseName">课程</span>
                <span class="slot-info" id="ratingPanelSlotInfo">周三 · 第3节</span>
            </div>
            <button class="panel-close-btn" onclick="closePanels()" title="关闭">✕</button>
        </div>
        <div class="panel-avg-row">
            <span class="avg-num" id="ratingPanelAvgNum">🌹 -</span>
            <span class="avg-count" id="ratingPanelAvgCount">暂无评分</span>
        </div>
        <div class="rating-picker" id="ratingPicker">
            <button class="rating-btn" data-score="1">1</button>
            <button class="rating-btn" data-score="2">2</button>
            <button class="rating-btn" data-score="3">3</button>
            <button class="rating-btn" data-score="4">4</button>
            <button class="rating-btn" data-score="5">5</button>
            <button class="rating-btn" data-score="6">6</button>
            <button class="rating-btn" data-score="7">7</button>
            <button class="rating-btn" data-score="8">8</button>
            <button class="rating-btn" data-score="9">9</button>
        </div>
        <textarea class="rating-comment-input" id="ratingCommentInput" placeholder="写点什么（可选）..." maxlength="200"></textarea>
        <div class="rating-actions">
            <button class="btn btn-primary" onclick="submitRating()">提交评分</button>
        </div>
    </div>

    <!-- ============ 评论面板 ============ -->
    <div class="comments-panel" id="commentsPanel">
        <div class="panel-header">
            <div class="panel-title">
                💬 评论
                <span class="slot-info" id="commentsPanelCount">(0)</span>
            </div>
            <button class="panel-close-btn" onclick="closePanels()" title="关闭">✕</button>
        </div>
        <div class="comments-list" id="commentsList">
            <div class="comment-empty">暂无评论</div>
        </div>
    </div>

    <!-- ============ 备注面板 ============ -->
    <div class="note-panel" id="notePanel">
        <div class="note-panel-title">
            <div>📝 <span id="notePanelCourseName">课程</span><span class="slot-info" id="notePanelSlotInfo"></span></div>
            <button class="panel-close-btn" onclick="closeNotePanel()" title="关闭">✕</button>
        </div>
        <textarea class="note-panel-textarea" id="notePanelText" placeholder="给这节课写点备注，比如：讲第三章、作业P45、预习下一节..." maxlength="200"></textarea>
        <div class="note-panel-actions">
            <span class="note-panel-hint">💡 双击课程格子可编辑完整信息</span>
            <div class="note-panel-btns">
                <button class="btn" onclick="closeNotePanel()">取消</button>
                <button class="btn btn-primary" onclick="saveNotePanel()">保存备注</button>
            </div>
        </div>
    </div>

    <!-- ============ 课程编辑弹窗 ============ -->
    <div class="modal-overlay" id="courseModal">
        <div class="modal-box">
            <h3 id="modalTitle">编辑课程</h3>
            <input type="hidden" id="editDayIndex">
            <input type="hidden" id="editPeriodIndex">

            <div class="form-group" id="courseNameGroup">
                <label id="courseNameLabel">课程名称</label>
                <input type="text" id="courseName" placeholder="如：数学、语文、体育...">
            </div>

            <div class="form-group" id="courseTimeGroup" style="display:none;">
                <label>考试时间</label>
                <div class="time-picker-row">
                    <input type="time" id="courseTimeStart" step="300">
                    <span class="sep">至</span>
                    <input type="time" id="courseTimeEnd" step="300">
                </div>
            </div>

            <div class="form-group" id="courseTeacherGroup">
                <label>教师（可选）</label>
                <input type="text" id="courseTeacher" placeholder="如：王老师">
            </div>

            <div class="form-group" id="courseRoomGroup">
                <label>教室（可选）</label>
                <input type="text" id="courseRoom" placeholder="如：本班教室、实验室2、操场">
            </div>

            <div class="form-group" id="courseNoteGroup">
                <label>备注（可选）</label>
                <textarea id="courseNote" placeholder="如：讲第三章，作业P45，预习下一节" maxlength="100"></textarea>
            </div>

            <div class="modal-actions">
                <button class="btn btn-danger" onclick="clearCourse()" style="display:none;" id="clearCourseBtn">清空</button>
                <button class="btn" onclick="closeCourseModal()">取消</button>
                <button class="btn btn-primary" onclick="saveCourse()">保存</button>
            </div>
        </div>
    </div>

    <!-- ============ 节次编辑弹窗 ============ -->
    <div class="modal-overlay" id="periodEditModal">
        <div class="modal-box">
            <h3 id="periodModalTitle">编辑节次</h3>
            <input type="hidden" id="editPeriodRowIndex">
            <div class="form-group">
                <label>节次名称</label>
                <input type="text" id="periodEditNameInput" placeholder="如：上午第1节 / 大课间 9:30-10:00">
            </div>
            <div class="form-group">
                <label>上下课时间（用于判断"当前正在上的课"）</label>
                <div class="time-picker-row">
                    <input type="time" id="periodStartTime" step="60">
                    <span class="sep">至</span>
                    <input type="time" id="periodEndTime" step="60">
                </div>
                <div style="font-size:11px;color:#888;margin-top:4px;">留空则不标记该节次为"当前"</div>
            </div>
            <div class="form-group">
                <label class="banner-check">
                    <input type="checkbox" id="periodIsBanner">
                    <span style="color:#d7b3f0; font-weight:700;">作为横幅行</span>
                    <span class="hint">横跨周一~周五 · 高度减半</span>
                </label>
            </div>
            <div class="period-edit-actions">
                <div class="row">
                    <button class="btn btn-primary" onclick="insertPeriodAbove()">⬆ 在上方插入</button>
                    <button class="btn btn-primary" onclick="insertPeriodBelow()">⬇ 在下方插入</button>
                </div>
                <div class="row">
                    <button class="btn btn-danger" onclick="deletePeriod()">🗑 删除此节次</button>
                    <button class="btn" onclick="closePeriodEditModal()">取消</button>
                </div>
                <button class="btn btn-success" style="width:100%;" onclick="savePeriodName()">✅ 保存名称</button>
            </div>
        </div>
    </div>

    <!-- ============ 时钟（从底部弹出） ============ -->
    <div class="clock-handle" id="clockHandle" onclick="toggleClock()" title="打开时钟">
        <span class="clock-handle-icon">🕐</span>
    </div>

    <div class="clock-drawer" id="clockDrawer">
        <div class="clock-drawer-visual">
            <canvas id="clockCanvas"></canvas>
        </div>
        <div class="clock-drawer-info">
            <div class="clock-drawer-header">
                <span>🕐 时钟</span>
                <button class="clock-drawer-close" onclick="toggleClock()">✕</button>
            </div>
            <div class="clock-digital" id="clockDigital">--:--:--</div>
            <div class="clock-status" id="clockStatus">--</div>
            <div class="clock-angles">
                <div class="clock-angle-item">
                    <span class="angle-label">时针</span>
                    <span class="angle-val" id="hourAngleVal">--°</span>
                </div>
                <div class="clock-angle-item">
                    <span class="angle-label">分针</span>
                    <span class="angle-val" id="minuteAngleVal">--°</span>
                </div>
                <div class="clock-angle-item highlight">
                    <span class="angle-label">夹角</span>
                    <span class="angle-val" id="betweenAngleVal">--°</span>
                </div>
            </div>
            <div class="clock-controls">
                <div class="clock-time-row">
                    <input type="number" id="clockHourInput" class="clock-num-input" min="0" max="23" placeholder="时">
                    <span class="clock-time-sep">:</span>
                    <input type="number" id="clockMinuteInput" class="clock-num-input" min="0" max="59" placeholder="分">
                    <button class="clock-btn clock-btn-set" onclick="applyClockTimeInput()">设定</button>
                </div>
                <div class="clock-btn-row">
                    <button class="clock-btn" id="clockPauseBtn" onclick="toggleClockPause()">⏸ 暂停</button>
                    <button class="clock-btn" onclick="clockStepMinute(-1)">−1 分</button>
                    <button class="clock-btn" onclick="clockStepMinute(1)">+1 分</button>
                    <button class="clock-btn" onclick="clockResetReal()">现在</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ============ 校历（从顶部弹出，横向布局） ============ -->
    <div class="calendar-handle" id="calendarHandle" onclick="toggleCalendar()" title="打开校历">
        <span class="calendar-handle-icon">📅</span>
    </div>

    <div class="calendar-drawer" id="calendarDrawer">
        <div class="calendar-drawer-left">
            <div class="calendar-drawer-title">
                <span>📅 校历</span>
                <button class="calendar-drawer-close" onclick="toggleCalendar()">✕</button>
            </div>
            <div class="calendar-term-title-inline" id="calendarTermTitle">
                <div>2026–2027 学年</div>
                <div>第一学期</div>
                <div>秋季</div>
            </div>
            <div class="calendar-date-pickers">
                <div class="calendar-date-picker">
                    <label>📖 开学日</label>
                    <div class="calendar-date-value" id="calStartDateValue" onclick="editDateValue('start')">--</div>
                </div>
                <div class="calendar-date-picker">
                    <label>🏁 期末日</label>
                    <div class="calendar-date-value" id="calEndDateValue" onclick="editDateValue('end')">--</div>
                </div>
            </div>
        </div>

        <div class="calendar-grid-wrap" id="calendarGridWrap">
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>

        <div class="calendar-drawer-right">
            <div class="calendar-stat-vertical">
                <div class="calendar-stat-item">
                    <span class="stat-label">📚 工作日</span>
                    <span class="stat-num work" id="statRemainingWorkdays">--</span>
                </div>
                <div class="calendar-stat-item">
                    <span class="stat-label">🎉 节假日</span>
                    <span class="stat-num holiday" id="statRemainingHolidays">--</span>
                </div>
            </div>
            <div class="calendar-btn-vertical">
                <button class="calendar-sync-btn" id="calendarSyncBtn" onclick="syncCalendar()">同步法定节假日</button>
                <button class="calendar-sync-btn calendar-manual-btn" id="calendarManualBtn" onclick="toggleManualEdit()">手动选择节假日</button>
            </div>
        </div>
    </div>

    <!-- 隐藏的结束日期选择器（供 editEndDate 调用 showPicker） -->

    <script src="dataManager.js"></script>
    <script src="schedule.js"></script>
</body>
</html>
