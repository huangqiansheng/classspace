        // ================================================================
        //  时钟抽屉
        // ================================================================
        let clockAnimId = null;
        let clockDPRInitialized = false;

        function toggleClock() {
            const drawer = document.getElementById('clockDrawer');
            const handle = document.getElementById('clockHandle');
            const isOpen = drawer.classList.toggle('open');
            handle.classList.toggle('hidden', isOpen);

                startClock();
            } else {
                stopClock();
            }
        }

        function startClock() {
            stopClock();
            const loop = () => {
                drawClock();
                clockAnimId = requestAnimationFrame(loop);
            };
            loop();
        }

        function stopClock() {
            if (clockAnimId) {
                cancelAnimationFrame(clockAnimId);
                clockAnimId = null;
            }
        }

        function drawClock() {
            const canvas = document.getElementById('clockCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            const DPR = window.devicePixelRatio || 1;
            const cssW = 380;
            const cssH = 380;
            const targetW = Math.round(cssW * DPR);
            const targetH = Math.round(cssH * DPR);
            if (canvas.width !== targetW || canvas.height !== targetH) {
                canvas.width = targetW;
                canvas.height = targetH;
            }
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

            const W = cssW, H = cssH;
            const cx = W / 2, cy = H / 2;
            const R = 170;

            ctx.clearRect(0, 0, W, H);

            const glow = ctx.createRadialGradient(cx, cy, R * 0.5, cx, cy, R * 1.18);
            glow.addColorStop(0, 'rgba(247,151,30,0.18)');
            glow.addColorStop(1, 'rgba(247,151,30,0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(cx, cy, R * 1.18, 0, Math.PI * 2);
            ctx.fill();

            const bg = ctx.createRadialGradient(cx, cy - 40, 20, cx, cy, R);
            bg.addColorStop(0, '#1e2f47');
            bg.addColorStop(1, '#0b1626');
            ctx.fillStyle = bg;
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(247,151,30,0.55)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, R, 0, Math.PI * 2);
            ctx.stroke();

            ctx.strokeStyle = 'rgba(255,215,0,0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, R - 14, 0, Math.PI * 2);
            ctx.stroke();

            for (let i = 0; i < 60; i++) {
                const angle = (Math.PI * 2 / 60) * i - Math.PI / 2;
                const isHour = i % 5 === 0;
                const outerR = R - 8;
                const innerR = isHour ? R - 24 : R - 14;
                const x1 = cx + Math.cos(angle) * outerR;
                const y1 = cy + Math.sin(angle) * outerR;
                const x2 = cx + Math.cos(angle) * innerR;
                const y2 = cy + Math.sin(angle) * innerR;
                ctx.strokeStyle = isHour ? '#ffd700' : 'rgba(255,215,0,0.32)';
                ctx.lineWidth = isHour ? 3 : 1;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 24px -apple-system, "Microsoft YaHei", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                const angle = (Math.PI * 2 / 12) * i - Math.PI / 2;
                const numR = R - 48;
                const x = cx + Math.cos(angle) * numR;
                const y = cy + Math.sin(angle) * numR;
                ctx.fillText(String(i), x, y);
            }

            const now = new Date();
            const h = now.getHours() % 12;
            const m = now.getMinutes();
            const s = now.getSeconds();
            const ms = now.getMilliseconds();

            const hAngle = ((h + m / 60 + s / 3600) / 12) * Math.PI * 2;
            const mAngle = ((m + s / 60) / 60) * Math.PI * 2;
            const sAngle = ((s + ms / 1000) / 60) * Math.PI * 2;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(hAngle);
            ctx.strokeStyle = '#ffffff';
            ctx.lineCap = 'round';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(0, 12);
            ctx.lineTo(0, -85);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,215,0,0.65)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(0, -82);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(mAngle);
            ctx.strokeStyle = '#ffffff';
            ctx.lineCap = 'round';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(0, 16);
            ctx.lineTo(0, -125);
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,215,0,0.55)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.lineTo(0, -122);
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(sAngle);
            ctx.strokeStyle = '#ff4d4d';
            ctx.lineCap = 'round';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 24);
            ctx.lineTo(0, -142);
            ctx.stroke();
            ctx.fillStyle = '#ff4d4d';
            ctx.beginPath();
            ctx.arc(0, -142, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, 24, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = '#0b1626';
            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.fillStyle = '#ffd700';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fill();

            const digital = document.getElementById('clockDigital');
            if (digital) {
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                const ss = String(now.getSeconds()).padStart(2, '0');
                const newText = hh + ':' + mm + ':' + ss;
                if (digital.textContent !== newText) digital.textContent = newText;
            }

            const dateEl = document.getElementById('clockDate');
            if (dateEl) {
                const y = now.getFullYear();
                const mo = String(now.getMonth() + 1).padStart(2, '0');
                const d = String(now.getDate()).padStart(2, '0');
                const newText = y + ' 年 ' + mo + ' 月 ' + d + ' 日';
                if (dateEl.textContent !== newText) dateEl.textContent = newText;
            }

            const weekdayEl = document.getElementById('clockWeekday');
            if (weekdayEl) {
                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const newText = weekdays[now.getDay()];
                if (weekdayEl.textContent !== newText) weekdayEl.textContent = newText;
            }
        }

        window.toggleClock = toggleClock;

        document.getElementById('notePanelText').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                saveNotePanel();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                closeNotePanel();
            }
        });

        renderWorkFocus();
        loadData();
        renderTable();
        startCurrentPeriodTimer();
    </script>
</body>
</html>
