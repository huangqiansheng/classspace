<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>班级空间 - 正在加载...</title>
    
    <!-- 方案一：优先使用 JavaScript 立即跳转，并用 replace 避免用户点后退时死循环 -->
    <script>
        window.location.replace("home.html");
    </script>
    
    <!-- 方案二：如果 JS 没生效，用 HTML Meta 刷新兜底 -->
    <meta http-equiv="refresh" content="0; url=home.html">
</head>
<body style="background-color: #f4f7fb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="color: #64748b; font-family: sans-serif;">正在进入班级空间，请稍候...</div>
</body>
</html>
