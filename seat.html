    <!-- ===== 主题切换脚本（位于 app.js 之后） ===== -->
    <script>
        function switchTheme(theme) {
            clearCustomTheme();
            document.body.classList.remove('theme-light');
            if (theme === 'light') {
                document.body.classList.add('theme-light');
            }
            try {
                var classId = typeof CURRENT_CLASS !== 'undefined' ? CURRENT_CLASS : 'default';
                localStorage.setItem('seatTheme_' + classId, theme);
            } catch(e) {}
        }

        function applyCustomColor(color) {
            document.body.classList.remove('theme-light');
            const rgb = hexToRgb(color);
            const brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
            const textColor = brightness > 128 ? '#1e293b' : '#ffffff';
            const root = document.documentElement;
            root.style.setProperty('--bg-body', color);
            root.style.setProperty('--text-primary', textColor);
            root.style.setProperty('--bg-app', `rgba(${rgb.r},${rgb.g},${rgb.b},0.15)`);
            root.style.setProperty('--bg-grid', `rgba(${rgb.r},${rgb.g},${rgb.b},0.10)`);
            root.style.setProperty('--bg-cell', `rgba(${rgb.r},${rgb.g},${rgb.b},0.10)`);
            root.style.setProperty('--bg-sidepanel', `rgba(${rgb.r},${rgb.g},${rgb.b},0.95)`);
            root.style.setProperty('--border-app', `rgba(${rgb.r},${rgb.g},${rgb.b},0.25)`);
            root.style.setProperty('--border-toolbar', `rgba(${rgb.r},${rgb.g},${rgb.b},0.25)`);
            root.style.setProperty('--border-grid', `rgba(${rgb.r},${rgb.g},${rgb.b},0.20)`);
            root.style.setProperty('--border-cell', `rgba(${rgb.r},${rgb.g},${rgb.b},0.20)`);
            root.style.setProperty('--border-sidepanel', `rgba(${rgb.r},${rgb.g},${rgb.b},0.30)`);
            root.style.setProperty('--bg-toolbar-btn', `rgba(${rgb.r},${rgb.g},${rgb.b},0.12)`);
            try {
                var classId = typeof CURRENT_CLASS !== 'undefined' ? CURRENT_CLASS : 'default';
                localStorage.setItem('seatTheme_' + classId, 'custom');
                localStorage.setItem('seatCustomColor_' + classId, color);
            } catch(e) {}
        }

        function clearCustomTheme() {
            const vars = [
                '--bg-body', '--text-primary', '--bg-app', '--bg-grid', '--bg-cell',
                '--bg-sidepanel', '--border-app', '--border-toolbar', '--border-grid',
                '--border-cell', '--border-sidepanel', '--bg-toolbar-btn'
            ];
            const root = document.documentElement;
            vars.forEach(v => root.style.removeProperty(v));
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        document.getElementById('customColorPicker').addEventListener('change', function() {
            applyCustomColor(this.value);
        });

        (function() {
            try {
                var classId = typeof CURRENT_CLASS !== 'undefined' ? CURRENT_CLASS : 'default';
                var theme = localStorage.getItem('seatTheme_' + classId);
                if (theme === 'custom') {
                    var color = localStorage.getItem('seatCustomColor_' + classId);
                    if (color) {
                        applyCustomColor(color);
                        document.getElementById('customColorPicker').value = color;
                    }
                } else if (theme === 'light') {
                    document.body.classList.add('theme-light');
                }
            } catch(e) {}
        })();
    </script>
    <!-- ===== 排号图例条（1~9 号可自定义名称） ===== -->
    <script>
    (function() {
        'use strict';
        const params = new URLSearchParams(window.location.search);
        const CLASS_ID = params.get('classId') || params.get('class')
                      || localStorage.getItem('currentClassId') || '一班';
        const STORAGE_KEY = 'seatOrderLabels_' + CLASS_ID;
        const DEFAULTS = {1:'1号',2:'2号',3:'3号',4:'4号',5:'5号',6:'6号',7:'7号',8:'8号',9:'9号'};

        let labels = Object.assign({}, DEFAULTS);
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const saved = JSON.parse(raw);
                if (saved && typeof saved === 'object') {
                    for (let i = 1; i <= 9; i++) {
                        if (typeof saved[i] === 'string' && saved[i].trim()) labels[i] = saved[i];
                    }
                }
            }
        } catch(e) {}

        function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(labels)); } catch(e) {} }
        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // ===== 座位徽章刷新：让座位右上角显示自定义名称 =====
        function patchSeatBadges() {
            document.querySelectorAll('.seat .order-badge').forEach(function(el) {
                const m = (el.className || '').match(/color-([1-9])/);
                if (!m) return;
                const n = parseInt(m[1], 10);
                const want = String(labels[n] || n);
                if (el.textContent !== want) el.textContent = want;
            });
        }
        window.refreshSeatOrderBadges = patchSeatBadges;

        // Hook render：每次 app.js 重画网格后，自动应用自定义名称
        (function hookRender() {
            const origRender = window.render;
            if (typeof origRender === 'function') {
                window.render = function() {
                    origRender.apply(this, arguments);
                    patchSeatBadges();
                };
            }
        })();

        function render() {
            const bar = document.getElementById('orderLegendBar');
            if (!bar) return;
            bar.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const item = document.createElement('div');
                item.className = 'order-legend-item';
                item.title = '点击改名 · 右键恢复默认\n当前：' + labels[i];
                item.innerHTML =
                    '<span class="legend-num color-' + i + '">' + i + '</span>' +
                    '<span class="legend-label">' + esc(labels[i]) + '</span>';

                item.addEventListener('click', function() {
                    const input = prompt('修改「' + i + ' 号」的名称\n（颜色不变，仅改文字；留空恢复默认）', labels[i]);
                    if (input === null) return;
                    const t = input.trim();
                    labels[i] = t ? t.slice(0, 8) : DEFAULTS[i];
                    save(); render(); patchSeatBadges();
                });
                item.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    if (!confirm('将「' + i + ' 号」恢复默认名称？')) return;
                    labels[i] = DEFAULTS[i];
                    save(); render(); patchSeatBadges();
                });
                bar.appendChild(item);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() { render(); patchSeatBadges(); });
        } else {
            render();
            patchSeatBadges();
        }
    })();
    </script>
